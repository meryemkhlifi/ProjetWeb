<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .prescription-item {
            margin-bottom: 15px;
        }
        .prescription-item img {
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
        }
        
        /* New drag and drop zone styling */
        .upload-zone {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 250px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            padding: 20px;
            color: #404040;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        
        .upload-zone:hover {
            border-color: #007bff;
            background-color: #f0f8ff;
        }
        
        .upload-zone.dragover {
            border-color: #007bff;
            background-color: #e9f5ff;
        }
        
        .upload-icon i {
            font-size: 60px;
            color: #007bff;
            margin-bottom: 15px;
        }
        
        .upload-zone h5 {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #666;
        }
        
        /* Navigation bar styling */
        .navbar {
            background-color: white !important;
            border-bottom: 1px solid #eee;
        }
        
        .btn-outline-primary {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
                <!-- Navigation Bar -->
                <nav class="navbar navbar-expand-lg navbar-light">
                    <div class="container">
                        <a class="navbar-brand" href="home.html">
                            <img src="../images/logo.png" alt="Logo" width="120">
                        </a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item">
                                    <a class="nav-link" href="home.html">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="medications.html">Medications</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link active" href="prescriptions.html">Prescriptions</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="emergency.html">Emergency Contacts</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="calendar.html">Calendar</a>
                                </li>
                            </ul>
                            <div class="d-flex align-items-center">
                                <a href="profile.html" class="btn btn-outline-primary">
                                    <i class="fas fa-user"></i> Profile
                                </a>
                            </div>
                        </div>
                    </div>
                </nav>

    <div class="container mt-4">
        <h1 class="text-center mb-4">My Prescriptions</h1>

        <!-- Prescription List -->
        <div id="prescriptions-list" class="mb-4">
            <!-- Prescriptions will be rendered here by prescriptions.js -->
        </div>

        <!-- Updated Upload Form -->
        <form id="upload-form" enctype="multipart/form-data">
            <div class="upload-zone" id="upload-zone">
                <input type="file" id="file-input" name="prescription" class="d-none" accept=".pdf,.jpg,.jpeg,.png">
                <div class="upload-icon">
                    <i class="fas fa-file-upload"></i>
                </div>
                <h5>Drag & Drop Files Here</h5>
                <p class="text-muted">or click to browse files</p>
            </div>
            
            <div class="mb-3 mt-3">
                <label for="notes" class="form-label">Notes (optional)</label>
                <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" id="upload-button">
                <i class="fas fa-upload me-2"></i> Upload Prescription
            </button>
        </form>
    </div>

    <!-- JS -->
    <script src="../scripts/prescriptions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
            // File upload handling (keep this in your HTML)
    document.getElementById('upload-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const fileInput = document.getElementById('file-input');
        
        if (!fileInput.files.length) {
            alert('Please select a file to upload');
            return;
        }

        const uploadButton = document.getElementById('upload-button');
        const originalText = uploadButton.innerHTML;
        uploadButton.disabled = true;
        uploadButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Uploading...';

        try {
            const response = await fetch("../database/prescriptions.php", {
                method: "POST",
                body: formData
            });
            
            const data = await response.json();
            
            if (data.status === "success") {
                // Refresh the prescriptions list
                if (typeof renderPrescriptions === 'function') {
                    renderPrescriptions();
                }
                // Reset form
                this.reset();
                // Show success message
                alert('Prescription uploaded successfully!');
            } else {
                throw new Error(data.message || 'Upload failed');
            }
        } catch (error) {
            console.error("Upload error:", error);
            alert("Error: " + error.message);
        } finally {
            uploadButton.disabled = false;
            uploadButton.innerHTML = originalText;
        }
    });
        // Drag-and-drop functionality
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');

        uploadZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, () => uploadZone.classList.remove('dragover'), false);
        });

        uploadZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            fileInput.files = dt.files;
        });
    </script>
</body>
</html>
